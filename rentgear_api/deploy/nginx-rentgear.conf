# Situs dan API RentGear di satu alamat. Dipasang ke /etc/nginx/sites-enabled/rentgear_serverbaik_my_id.
server {
    listen 80;
    server_name rentgear.serverbaik.my.id;
    root /var/www/rentgear_serverbaik_my_id;
    index index.html index.htm;
    client_max_body_size 20m;
    server_tokens off;

    # API Laravel (php artisan serve di port 8000, hanya dari dalam HP).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Cloudflare sudah memakai https ke pengunjung; nginx di sini hanya menerima http dari tunnel.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # main.dart.<hash>.js berganti nama tiap build, jadi aman disimpan lama.
    location ~ ^/main\.dart\.[0-9a-f]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Berkas lain (font ikon, index.html, aset) memakai nama yang sama tiap build. Tanpa header ini Cloudflare
    # menyimpannya 4 jam, sehingga ikon baru tidak muncul setelah situs diperbarui.
    location / {
        add_header Cache-Control "no-cache";
        # nginx tidak mewariskan add_header ke blok yang punya add_header sendiri, jadi header keamanan diulang.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ =404;
    }
}
